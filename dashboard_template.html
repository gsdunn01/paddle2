<title>Paddle League Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #f3f4f6; --surface: #ffffff; --surface-2: #f7f8fa; --ink: #1d232b; --muted: #5f6b78; --line: #dde2e8;
    --accent: #1f5f8b; --accent-soft: #e3eef6; --code-bg: #eef1f4;
    --series-1: #2a78d6; --series-2: #eb6834; --seq-3: #6da7ec; --seq-1: #cde2fb;
    --good: #008300; --bad: #e34948;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #13171c; --surface: #1b2129; --surface-2: #202832; --ink: #e5e9ee; --muted: #94a1b0; --line: #2d3641;
    --accent: #7fb3d8; --accent-soft: #1e2f3d; --code-bg: #232b35;
    --series-1: #3987e5; --series-2: #d95926; --seq-3: #5598e7; --seq-1: #184f95; --good: #4caf50; --bad: #e66767; } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #13171c; --surface: #1b2129; --surface-2: #202832; --ink: #e5e9ee; --muted: #94a1b0; --line: #2d3641;
    --accent: #7fb3d8; --accent-soft: #1e2f3d; --code-bg: #232b35;
    --series-1: #3987e5; --series-2: #d95926; --seq-3: #5598e7; --seq-1: #184f95; --good: #4caf50; --bad: #e66767; }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 0 48px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 20px; padding-block: 24px 14px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .scope { display: flex; gap: 8px; flex-wrap: wrap; }
  select, input[type=search], input[type=text] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  nav.tabs button { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  nav.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  section[hidden] { display: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .l { font-size: 12px; color: var(--muted); margin-top: 3px; }
  h2 { font-size: 16px; font-weight: 600; margin: 22px 0 8px; }
  h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }
  .toolbar label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .card .hd { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card .hd b { font-weight: 600; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
  th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; }
  th.sorted::after { content: " ▾"; } th.sorted.asc::after { content: " ▴"; }
  td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.rowlink { cursor: pointer; } tr.rowlink:hover td { background: var(--surface-2); }
  .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--series-1); vertical-align: middle; margin-right: 6px; }
  .bartrack { display: inline-block; width: 80px; height: 8px; border-radius: 4px; background: var(--seq-1); vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .bartrack i { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }
  .muted { color: var(--muted); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; }
  a.lnk { color: var(--accent); text-decoration: none; cursor: pointer; } a.lnk:hover { text-decoration: underline; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .pill.w { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .pill.l { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .pill.x { background: var(--code-bg); color: var(--muted); }
  /* fixtures */
  .date-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .fixture { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .fixture .fh { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: baseline; }
  .fixture .fh .teams { font-weight: 600; }
  .fixture .fh .teams .vs { color: var(--muted); font-weight: 400; margin: 0 6px; }
  .lines { display: grid; grid-template-columns: 34px 1fr auto 1fr auto; align-items: center; column-gap: 12px; row-gap: 0; }
  .lines > div { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .lines > div:nth-last-child(-n+5) { border-bottom: 0; }
  .lines .ln { color: var(--muted); font-size: 12px; padding-left: 14px; }
  .lines .side { font-size: 13.5px; } .lines .side.win { font-weight: 600; }
  .lines .side span { display: block; }
  .lines .sc { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; white-space: nowrap; text-align: center; }
  .lines .rs { padding-right: 14px; font-size: 11px; color: var(--muted); text-align: right; }
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .detail .dh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail .dh b { font-size: 17px; font-weight: 600; }
  .detail .back { font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--ink); }
  .kv { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .kv b { color: var(--ink); font-weight: 600; }
  figure { margin: 0; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 6px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--ground); font-size: 12px; padding: 5px 8px; border-radius: 6px; z-index: 10; white-space: nowrap; }
  .tip[hidden] { display: none; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .more { display: block; width: 100%; font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; color: var(--accent); }
  @media (max-width: 600px) { .lines { grid-template-columns: 28px 1fr auto 1fr; } .lines .rs { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
<header>
  <div><h1>Paddle League Explorer</h1><div class="sub" id="scopeSub"></div></div>
  <div class="scope">
    <select id="selLeague" aria-label="League"></select>
    <select id="selSeason" aria-label="Season"></select>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <button class="on" data-tab="overview">Overview</button>
  <button data-tab="matches">Matches</button>
  <button data-tab="clubs">Clubs</button>
  <button data-tab="players">Players</button>
</nav>

<section id="tab-overview">
  <div class="tiles" id="tiles"></div>
  <div class="toolbar"><label>Division <select id="selDivStand"></select></label></div>
  <div id="standings"></div>
</section>

<section id="tab-matches" hidden>
  <div class="toolbar">
    <input type="search" id="qMatch" placeholder="Search team, player, club or date (e.g. 2026-01)…" aria-label="Search matches">
    <label>Division <select id="selDivMatch"></select></label>
    <label><input type="checkbox" id="chkNonLeague"> include stand-alone matches</label>
  </div>
  <div id="matchList"></div>
</section>

<section id="tab-clubs" hidden>
  <div id="clubDetail" hidden></div>
  <div id="clubTableWrap"><div class="card"><div class="tablewrap"><table id="clubTable"></table></div></div></div>
</section>

<section id="tab-players" hidden>
  <div id="playerDetail" hidden></div>
  <div id="playerTableWrap">
    <div class="toolbar"><input type="search" id="qPlayer" placeholder="Search player or club…" aria-label="Search players"><label>Min lines <select id="selMinLines"><option>1</option><option selected>3</option><option>5</option><option>10</option></select></label></div>
    <div class="card"><div class="tablewrap"><table id="playerTable"></table></div></div>
  </div>
</section>
</div>
<div class="tip" id="tip" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var pct = function (w, n) { return n ? Math.round(100 * w / n) + '%' : '–'; };

  // ---------- indexes
  var leagues = {}, seasons = {}, locs = {}, groups = {}, divs = {}, teams = {}, players = {}, winner = {};
  var loaded = {}, teamSeason = {}, playerSeason = {}, matches = {};
  function ingest(D) {
    (D.leagues || []).forEach(function (r) { leagues[r[0]] = { id: r[0], name: r[1] }; });
    (D.seasons || []).forEach(function (r) { seasons[r[0]] = { id: r[0], league: r[1], name: r[2] }; });
    (D.winner || []).forEach(function (r) { winner[r[0]] = { desc: r[1], res: r[2] }; });
    (D.locations || []).forEach(function (r) { locs[r[0]] = { id: r[0], name: r[1], city: r[2], state: r[3], courts: r[4] }; });
    (D.groups || []).forEach(function (r) { groups[r[0]] = r[1]; });
    (D.divisions || []).forEach(function (r) { divs[r[0]] = { id: r[0], group: r[1], name: r[2], full: r[2] + (groups[r[1]] ? ' · ' + groups[r[1]] : '') }; });
    (D.teams || []).forEach(function (r) { teams[r[0]] = { id: r[0], name: r[1], loc: r[2], league: r[3] }; });
    (D.players || []).forEach(function (r) { players[r[0]] = { id: r[0], name: r[1] }; });
    (D.team_seasons || []).forEach(function (r) { (teamSeason[r[1]] = teamSeason[r[1]] || {})[r[0]] = { div: r[2], name: r[3] }; });
    (D.player_seasons || []).forEach(function (r) { (playerSeason[r[1]] = playerSeason[r[1]] || {})[r[0]] = { loc: r[2], rating: r[3] }; });
    (D.matches || []).forEach(function (r) { matches[r[0]] = { id: r[0], season: r[1], date: r[2], home: r[3], away: r[4], league: r[5], bye: r[6], lines: [] }; });
    (D.lines || []).forEach(function (r) {
      var l = { id: r[0], sched: r[1], no: r[2], div: r[3], w: r[4], h: [r[5], r[6]], a: [r[7], r[8]], score: r[9], gh: r[10], ga: r[11], nm: [r[12], r[13], r[14], r[15]] };
      l.res = (winner[l.w] || {}).res || 'none';
      var m = matches[l.sched]; if (m) { l.m = m; m.lines.push(l); }
    });
    Object.keys(matches).forEach(function (k) { matches[k].lines.sort(function (a, b) { return a.no - b.no; }); });
  }
  ingest(D);
  function loadLeague(id) {
    if (!D.lazy || loaded[id]) return Promise.resolve();
    $('#scopeSub').textContent = 'Loading ' + leagues[id].name + '…';
    return new Promise(function (resolve, reject) {
      window.__league = function (lid, d) { ingest(d); loaded[lid] = true; resolve(); };
      var sc = document.createElement('script'); sc.src = 'data/league_' + id + '.js?v=' + (D.version || '1');
      sc.onerror = function () { $('#scopeSub').textContent = 'Could not load data for ' + leagues[id].name; reject(); };
      document.head.appendChild(sc);
    });
  }
  var pname = function (id, fallback) { return id && players[id] ? players[id].name : (fallback || 'N/A'); };
  var teamName = function (id, season) { var ts = teamSeason[season] && teamSeason[season][id]; return ts ? ts.name : (teams[id] ? teams[id].name : '–'); };
  var clubOfTeam = function (id) { var t = teams[id]; return t && locs[t.loc] ? locs[t.loc].name : '–'; };

  // ---------- scope
  var state = { league: null, season: null, tab: 'overview' };
  var selLeague = $('#selLeague'), selSeason = $('#selSeason');
  Object.values(leagues).forEach(function (l) { selLeague.add(new Option(l.name, l.id)); });
  function fillSeasons() {
    selSeason.innerHTML = '';
    Object.values(seasons).filter(function (s) { return s.league == state.league; }).sort(function (a, b) { return b.id - a.id; })
      .forEach(function (s) { selSeason.add(new Option(s.name, s.id)); });
    state.season = +selSeason.value;
  }
  state.league = +selLeague.value; fillSeasons();
  selLeague.addEventListener('change', function () { state.league = +selLeague.value; fillSeasons(); loadLeague(state.league).then(refresh); });
  selSeason.addEventListener('change', function () { state.season = +selSeason.value; refresh(); });

  var S = {}; // per-scope computed
  function compute() {
    var sid = state.season;
    S.matches = Object.values(matches).filter(function (m) { return m.season === sid; }).sort(function (a, b) { return (a.date || '').localeCompare(b.date || '') || a.id - b.id; });
    S.lines = []; S.matches.forEach(function (m) { S.lines = S.lines.concat(m.lines); });
    S.teams = {}; var ts = teamSeason[sid] || {};
    Object.keys(ts).forEach(function (id) { S.teams[id] = { id: +id, name: ts[id].name, div: ts[id].div, club: clubOfTeam(+id), loc: (teams[id] || {}).loc, mp: 0, mw: 0, lp: 0, lw: 0, gf: 0, ga: 0 }; });
    S.players = {}; var ps = playerSeason[sid] || {};
    function P(id) { if (!S.players[id]) S.players[id] = { id: id, name: pname(id), loc: ps[id] ? ps[id].loc : null, rating: ps[id] ? ps[id].rating : null, lp: 0, lw: 0, ll: 0, gf: 0, ga: 0, byLine: {}, lines: [], teams: {} }; return S.players[id]; }
    Object.keys(ps).forEach(function (id) { P(+id); });
    S.matches.forEach(function (m) {
      if (!m.league) return;
      var th = S.teams[m.home], ta = S.teams[m.away], hw = 0, aw = 0;
      m.lines.forEach(function (l) {
        if (l.res === 'home') hw++; else if (l.res === 'away') aw++;
        if (th) { th.lp += (l.res !== 'none'); th.lw += (l.res === 'home'); th.gf += l.gh; th.ga += l.ga; }
        if (ta) { ta.lp += (l.res !== 'none'); ta.lw += (l.res === 'away'); ta.gf += l.ga; ta.ga += l.gh; }
      });
      if (th && ta && !m.bye && m.lines.length) { th.mp++; ta.mp++; if (hw > aw) th.mw++; else if (aw > hw) ta.mw++; }
    });
    S.lines.forEach(function (l) {
      [['h', l.h, l.m.home], ['a', l.a, l.m.away]].forEach(function (side) {
        side[1].forEach(function (id) {
          if (!id) return; var p = P(id);
          var won = l.res === 'none' ? null : (l.res === 'home') === (side[0] === 'h');
          p.lines.push({ l: l, side: side[0], won: won });
          if (won !== null) { p.lp++; if (won) p.lw++; else p.ll++; var b = p.byLine[l.no] = p.byLine[l.no] || { w: 0, l: 0 }; won ? b.w++ : b.l++; }
          p.gf += side[0] === 'h' ? l.gh : l.ga; p.ga += side[0] === 'h' ? l.ga : l.gh;
          if (side[2]) p.teams[side[2]] = (p.teams[side[2]] || 0) + 1;
        });
      });
    });
    S.clubs = {};
    Object.values(S.teams).forEach(function (t) {
      var c = S.clubs[t.loc] = S.clubs[t.loc] || { id: t.loc, name: t.club, city: locs[t.loc] ? [locs[t.loc].city, locs[t.loc].state].filter(Boolean).join(', ') : '', teams: [], players: 0, lp: 0, lw: 0, mp: 0, mw: 0 };
      c.teams.push(t); c.lp += t.lp; c.lw += t.lw; c.mp += t.mp; c.mw += t.mw;
    });
    Object.values(S.players).forEach(function (p) { if (p.loc && S.clubs[p.loc]) S.clubs[p.loc].players++; });
    S.divs = {}; Object.values(S.teams).forEach(function (t) { S.divs[t.div] = divs[t.div] || { id: t.div, name: 'Division ' + t.div, full: 'Division ' + t.div }; });
  }

  // ---------- overview
  function renderOverview() {
    var league = S.matches.filter(function (m) { return m.league && !m.bye && m.lines.length; });
    var played = S.lines.filter(function (l) { return l.res !== 'none'; }).length;
    var active = Object.values(S.players).filter(function (p) { return p.lines.length; }).length;
    var dates = league.map(function (m) { return m.date; }).filter(Boolean);
    $('#tiles').innerHTML = [
      [league.length, 'league fixtures'], [played, 'lines with a result'], [S.lines.length - played, 'forfeits / unreported'],
      [active, 'players who played'], [Object.keys(S.clubs).length, 'clubs'],
      [dates.length ? dates[0].slice(5) + ' → ' + dates[dates.length - 1].slice(5) : '–', 'first → last match']
    ].map(function (t) { return '<div class="tile"><div class="v">' + esc(t[0]) + '</div><div class="l">' + t[1] + '</div></div>'; }).join('');
    var sel = $('#selDivStand'), cur = sel.value; sel.innerHTML = '<option value="">All divisions</option>';
    Object.values(S.divs).sort(function (a, b) { return a.full.localeCompare(b.full, undefined, { numeric: true }); }).forEach(function (d) { sel.add(new Option(d.full, d.id)); });
    sel.value = cur; if (sel.selectedIndex < 0) sel.value = '';
    renderStandings();
  }
  function renderStandings() {
    var want = $('#selDivStand').value, out = '';
    Object.values(S.divs).sort(function (a, b) { return a.full.localeCompare(b.full, undefined, { numeric: true }); }).forEach(function (d) {
      if (want && +want !== d.id) return;
      var rows = Object.values(S.teams).filter(function (t) { return t.div === d.id && (t.lp || t.mp); })
        .sort(function (a, b) { return b.mw - a.mw || (b.lw / (b.lp || 1)) - (a.lw / (a.lp || 1)) || (b.gf - b.ga) - (a.gf - a.ga); });
      if (!rows.length) return;
      out += '<div class="card"><div class="hd"><b>' + esc(d.full) + '</b><span class="muted">' + rows.length + ' teams</span></div><div class="tablewrap"><table><tr><th>#</th><th>Team</th><th>Club</th><th class="n">Matches</th><th class="n">W</th><th class="n">L</th><th class="n">Lines W-L</th><th>Line win %</th><th class="n">Games ±</th></tr>' +
        rows.map(function (t, i) {
          var p = t.lp ? t.lw / t.lp : 0;
          return '<tr class="rowlink" data-team="' + t.id + '"><td class="n muted">' + (i + 1) + '</td><td><b>' + esc(t.name) + '</b></td><td class="muted">' + esc(t.club) + '</td><td class="n">' + t.mp + '</td><td class="n">' + t.mw + '</td><td class="n">' + (t.mp - t.mw) + '</td><td class="n">' + t.lw + '-' + (t.lp - t.lw) + '</td><td><span class="bartrack"><i style="width:' + Math.round(100 * p) + '%"></i></span><span class="mono">' + pct(t.lw, t.lp) + '</span></td><td class="n mono">' + (t.gf - t.ga > 0 ? '+' : '') + (t.gf - t.ga) + '</td></tr>';
        }).join('') + '</table></div></div>';
    });
    $('#standings').innerHTML = out || '<div class="empty">No teams in this season.</div>';
    $('#standings').querySelectorAll('tr[data-team]').forEach(function (tr) {
      tr.addEventListener('click', function () { showTab('matches'); $('#qMatch').value = S.teams[tr.dataset.team].name; $('#selDivMatch').value = ''; renderMatches(); });
    });
  }
  $('#selDivStand').addEventListener('change', renderStandings);

  // ---------- matches
  var matchLimit = 60;
  function fixtureHTML(m) {
    var hn = m.home ? teamName(m.home, m.season) : null, an = m.away ? teamName(m.away, m.season) : null;
    var hw = m.lines.filter(function (l) { return l.res === 'home'; }).length, aw = m.lines.filter(function (l) { return l.res === 'away'; }).length;
    var title = m.league ? (hn || 'TBD') + '<span class="vs">vs</span>' + (an || 'TBD') : 'Stand-alone match';
    var right = m.bye ? '<span class="pill x">bye</span>' : (m.league ? '<span class="mono">' + hw + ' – ' + aw + '</span>' : '<span class="pill x">non-league</span>');
    var div = m.lines[0] && m.lines[0].div && divs[m.lines[0].div] ? divs[m.lines[0].div].name : '';
    var lines = m.lines.map(function (l) {
      var side = function (ids, nms, cls) { return '<div class="side ' + cls + '">' + ids.map(function (id, i) { return '<span>' + (id ? '<a class="lnk" data-player="' + id + '">' + esc(pname(id)) + '</a>' : '<span class="muted">' + esc(nms[i] || 'N/A') + '</span>') + '</span>'; }).join('') + '</div>'; };
      var w = winner[l.w] || { desc: 'code ' + l.w, res: 'none' };
      return '<div class="ln">L' + l.no + '</div>' + side(l.h, [l.nm[0], l.nm[1]], l.res === 'home' ? 'win' : '') +
        '<div class="sc">' + (esc(l.score) || '<span class="muted">—</span>') + '</div>' + side(l.a, [l.nm[2], l.nm[3]], l.res === 'away' ? 'win' : '') +
        '<div class="rs">' + (l.w === 1 || l.w === 2 ? '' : esc(w.desc.replace(/\s*\(.*\)/, ''))) + '</div>';
    }).join('');
    return '<div class="fixture"><div class="fh"><span class="teams">' + title + '</span><span class="muted">' + esc(div) + ' ' + right + '</span></div>' + (lines ? '<div class="lines">' + lines + '</div>' : '') + '</div>';
  }
  function renderMatches() {
    var q = $('#qMatch').value.trim().toLowerCase(), dv = $('#selDivMatch').value, nonl = $('#chkNonLeague').checked;
    var rows = S.matches.filter(function (m) {
      if (!nonl && !m.league) return false;
      if (dv && !(m.lines[0] && m.lines[0].div === +dv) && !(S.teams[m.home] && S.teams[m.home].div === +dv)) return false;
      if (!q) return true;
      var hay = [m.date, m.home ? teamName(m.home, m.season) : '', m.away ? teamName(m.away, m.season) : '', clubOfTeam(m.home), clubOfTeam(m.away)];
      m.lines.forEach(function (l) { l.h.concat(l.a).forEach(function (id) { if (id) hay.push(pname(id)); }); l.nm.forEach(function (n) { if (n) hay.push(n); }); });
      return hay.join(' | ').toLowerCase().indexOf(q) >= 0;
    });
    rows.sort(function (a, b) { return (b.date || '').localeCompare(a.date || '') || a.id - b.id; });
    var out = '', last = null, shown = rows.slice(0, matchLimit);
    shown.forEach(function (m) { if (m.date !== last) { last = m.date; out += '<div class="date-h">' + esc(fmtDate(m.date)) + '</div>'; } out += fixtureHTML(m); });
    if (!rows.length) out = '<div class="empty">No matches match that search.</div>';
    if (rows.length > shown.length) out += '<button class="more" id="moreMatches">Show more (' + (rows.length - shown.length) + ' remaining)</button>';
    $('#matchList').innerHTML = '<div class="muted" style="margin-bottom:6px">' + rows.length + ' fixtures</div>' + out;
    var mb = $('#moreMatches'); if (mb) mb.addEventListener('click', function () { matchLimit += 60; renderMatches(); });
    bindPlayerLinks($('#matchList'));
  }
  function fmtDate(d) { if (!d) return 'Unscheduled'; var t = new Date(d + 'T12:00:00'); return t.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }); }
  $('#qMatch').addEventListener('input', function () { matchLimit = 60; renderMatches(); });
  $('#selDivMatch').addEventListener('change', function () { matchLimit = 60; renderMatches(); });
  $('#chkNonLeague').addEventListener('change', function () { matchLimit = 60; renderMatches(); });
  function fillDivMatch() {
    var sel = $('#selDivMatch'), cur = sel.value; sel.innerHTML = '<option value="">All divisions</option>';
    Object.values(S.divs).sort(function (a, b) { return a.full.localeCompare(b.full, undefined, { numeric: true }); }).forEach(function (d) { sel.add(new Option(d.full, d.id)); });
    sel.value = cur; if (sel.selectedIndex < 0) sel.value = '';
  }

  // ---------- generic sortable table
  function table(el, cols, rows, sortState, onRow) {
    var sc = sortState.col, dir = sortState.dir;
    rows = rows.slice().sort(function (a, b) { var x = cols[sc].v(a), y = cols[sc].v(b); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir; });
    el.innerHTML = '<tr>' + cols.map(function (c, i) { return '<th class="' + (c.n ? 'n ' : '') + (i === sc ? 'sorted' + (dir > 0 ? ' asc' : '') : '') + '" data-i="' + i + '">' + c.h + '</th>'; }).join('') + '</tr>' +
      rows.map(function (r) { return '<tr class="rowlink" data-id="' + r.id + '">' + cols.map(function (c) { return '<td class="' + (c.n ? 'n' : '') + '">' + (c.f ? c.f(r) : esc(c.v(r))) + '</td>'; }).join('') + '</tr>'; }).join('');
    el.querySelectorAll('th').forEach(function (th) { th.addEventListener('click', function () { var i = +th.dataset.i; if (sortState.col === i) sortState.dir *= -1; else { sortState.col = i; sortState.dir = cols[i].n ? -1 : 1; } table(el, cols, rows, sortState, onRow); }); });
    el.querySelectorAll('tr[data-id]').forEach(function (tr) { tr.addEventListener('click', function () { onRow(tr.dataset.id); }); });
    if (!rows.length) el.innerHTML += '<tr><td colspan="' + cols.length + '" class="empty">Nothing to show.</td></tr>';
  }
  var barCell = function (w, n) { var p = n ? w / n : 0; return '<span class="bartrack"><i style="width:' + Math.round(100 * p) + '%"></i></span><span class="mono">' + pct(w, n) + '</span>'; };

  // ---------- clubs
  var clubSort = { col: 5, dir: -1 };
  function renderClubs() {
    var cols = [
      { h: 'Club', v: function (c) { return c.name; }, f: function (c) { return '<b>' + esc(c.name) + '</b>'; } },
      { h: 'Location', v: function (c) { return c.city; } },
      { h: 'Teams', n: 1, v: function (c) { return c.teams.length; } },
      { h: 'Players', n: 1, v: function (c) { return c.players; } },
      { h: 'Matches W-L', n: 1, v: function (c) { return c.mw; }, f: function (c) { return c.mw + '-' + (c.mp - c.mw); } },
      { h: 'Line win %', v: function (c) { return c.lp ? c.lw / c.lp : null; }, f: function (c) { return barCell(c.lw, c.lp); } },
      { h: 'Lines played', n: 1, v: function (c) { return c.lp; } }
    ];
    table($('#clubTable'), cols, Object.values(S.clubs), clubSort, showClub);
  }
  function showClub(id) {
    var c = S.clubs[id]; if (!c) return;
    var plist = Object.values(S.players).filter(function (p) { return p.loc == id && p.lp; }).sort(function (a, b) { return b.lw - a.lw || a.ll - b.ll; });
    var teamsHTML = c.teams.filter(function (t) { return t.lp || t.mp; }).sort(function (a, b) { return (divs[a.div] || {}).full > (divs[b.div] || {}).full ? 1 : -1; }).map(function (t) {
      return '<tr class="rowlink" data-team="' + t.id + '"><td><b>' + esc(t.name) + '</b></td><td class="muted">' + esc((divs[t.div] || {}).full || '') + '</td><td class="n">' + t.mw + '-' + (t.mp - t.mw) + '</td><td>' + barCell(t.lw, t.lp) + '</td><td class="n mono">' + (t.gf - t.ga > 0 ? '+' : '') + (t.gf - t.ga) + '</td></tr>';
    }).join('');
    var chart = barChart(c.teams.filter(function (t) { return t.lp; }).map(function (t) { return { label: t.name, a: t.lw, b: t.lp - t.lw }; }), 'Lines won', 'Lines lost', 'Lines won and lost by team');
    $('#clubDetail').innerHTML = '<div class="detail"><div class="dh"><b>' + esc(c.name) + '</b><button class="back" id="clubBack">← All clubs</button></div>' +
      '<div class="kv"><span>' + esc(c.city) + '</span><span>Teams <b>' + c.teams.length + '</b></span><span>Registered players <b>' + c.players + '</b></span><span>Matches <b>' + c.mw + '-' + (c.mp - c.mw) + '</b></span><span>Lines <b>' + c.lw + '-' + (c.lp - c.lw) + '</b> (' + pct(c.lw, c.lp) + ')</span>' + (locs[id] && locs[id].courts ? '<span>Courts <b>' + locs[id].courts + '</b></span>' : '') + '</div>' +
      chart + '<h3>Teams</h3><div class="card"><div class="tablewrap"><table><tr><th>Team</th><th>Division</th><th class="n">Matches W-L</th><th>Line win %</th><th class="n">Games ±</th></tr>' + teamsHTML + '</table></div></div>' +
      '<h3>Players (' + plist.length + ' with results)</h3><div class="card"><div class="tablewrap"><table><tr><th>Player</th><th class="n">Rating</th><th class="n">W</th><th class="n">L</th><th>Win %</th></tr>' +
      plist.slice(0, 40).map(function (p) { return '<tr class="rowlink" data-player="' + p.id + '"><td>' + esc(p.name) + '</td><td class="n mono">' + (p.rating != null ? p.rating.toFixed(1) : '') + '</td><td class="n">' + p.lw + '</td><td class="n">' + p.ll + '</td><td>' + barCell(p.lw, p.lp) + '</td></tr>'; }).join('') + '</table></div></div></div>';
    $('#clubDetail').hidden = false; $('#clubTableWrap').hidden = true;
    $('#clubBack').addEventListener('click', function () { $('#clubDetail').hidden = true; $('#clubTableWrap').hidden = false; });
    $('#clubDetail').querySelectorAll('tr[data-team]').forEach(function (tr) { tr.addEventListener('click', function () { showTab('matches'); $('#qMatch').value = S.teams[tr.dataset.team].name; renderMatches(); }); });
    bindPlayerLinks($('#clubDetail')); bindChart($('#clubDetail'));
    window.scrollTo({ top: 0 });
  }

  // ---------- players
  var playerSort = { col: 3, dir: -1 };
  function renderPlayers() {
    var q = $('#qPlayer').value.trim().toLowerCase(), min = +$('#selMinLines').value;
    var rows = Object.values(S.players).filter(function (p) {
      if (p.lp < min) return false;
      if (!q) return true;
      return (p.name + ' ' + (locs[p.loc] ? locs[p.loc].name : '')).toLowerCase().indexOf(q) >= 0;
    });
    var cols = [
      { h: 'Player', v: function (p) { return p.name; }, f: function (p) { return '<b>' + esc(p.name) + '</b>'; } },
      { h: 'Club', v: function (p) { return locs[p.loc] ? locs[p.loc].name : ''; } },
      { h: 'Rating', n: 1, v: function (p) { return p.rating; }, f: function (p) { return '<span class="mono">' + (p.rating != null ? p.rating.toFixed(1) : '') + '</span>'; } },
      { h: 'W', n: 1, v: function (p) { return p.lw; } },
      { h: 'L', n: 1, v: function (p) { return p.ll; } },
      { h: 'Win %', v: function (p) { return p.lp ? p.lw / p.lp : null; }, f: function (p) { return barCell(p.lw, p.lp); } },
      { h: 'Games ±', n: 1, v: function (p) { return p.gf - p.ga; }, f: function (p) { var d = p.gf - p.ga; return '<span class="mono">' + (d > 0 ? '+' : '') + d + '</span>'; } },
      { h: 'Usual line', n: 1, v: function (p) { var best = null; Object.keys(p.byLine).forEach(function (k) { var n = p.byLine[k].w + p.byLine[k].l; if (!best || n > best.n) best = { k: k, n: n }; }); return best ? +best.k : null; }, f: function (p) { var v = this.v(p); return v == null ? '' : 'L' + v; } }
    ];
    table($('#playerTable'), cols, rows, playerSort, showPlayer);
  }
  $('#qPlayer').addEventListener('input', renderPlayers);
  $('#selMinLines').addEventListener('change', renderPlayers);
  function showPlayer(id) {
    var p = S.players[id]; if (!p) return;
    showTab('players');
    var hist = p.lines.slice().sort(function (a, b) { return (b.l.m.date || '').localeCompare(a.l.m.date || ''); });
    var partners = {}, opps = {};
    hist.forEach(function (h) {
      var l = h.l, mine = h.side === 'h' ? l.h : l.a, theirs = h.side === 'h' ? l.a : l.h;
      mine.forEach(function (x) { if (x && x != id) { var r = partners[x] = partners[x] || { w: 0, l: 0 }; if (h.won === true) r.w++; else if (h.won === false) r.l++; } });
      theirs.forEach(function (x) { if (x) { var r = opps[x] = opps[x] || { w: 0, l: 0 }; if (h.won === true) r.w++; else if (h.won === false) r.l++; } });
    });
    var top = function (obj) { return Object.keys(obj).map(function (k) { return { id: +k, w: obj[k].w, l: obj[k].l }; }).sort(function (a, b) { return (b.w + b.l) - (a.w + a.l); }).slice(0, 6).map(function (r) { return '<a class="lnk" data-player="' + r.id + '">' + esc(pname(r.id)) + '</a> <span class="muted mono">' + r.w + '-' + r.l + '</span>'; }).join(' · '); };
    var byLine = [1, 2, 3, 4].map(function (n) { var b = p.byLine[n] || { w: 0, l: 0 }; return { label: 'Line ' + n, a: b.w, b: b.l }; });
    var chart = p.lp ? barChart(byLine, 'Won', 'Lost', 'Results by line number this season') : '';
    var teamsStr = Object.keys(p.teams).map(function (t) { return teamName(+t, state.season); }).join(', ');
    var rowsHTML = hist.map(function (h) {
      var l = h.l, m = l.m, mine = h.side === 'h' ? l.h : l.a, theirs = h.side === 'h' ? l.a : l.h, myTeam = h.side === 'h' ? m.home : m.away, oppTeam = h.side === 'h' ? m.away : m.home;
      var partner = mine.filter(function (x) { return x != id; })[0];
      var score = h.side === 'h' ? l.score : l.score.split(' ').map(function (s) { return s.split('-').reverse().join('-'); }).join(' ');
      var badge = h.won === true ? '<span class="pill w">W</span>' : h.won === false ? '<span class="pill l">L</span>' : '<span class="pill x">–</span>';
      return '<tr><td class="mono muted">' + esc(m.date || '') + '</td><td>' + badge + '</td><td>L' + l.no + '</td><td>' + (partner ? '<a class="lnk" data-player="' + partner + '">' + esc(pname(partner)) + '</a>' : '<span class="muted">—</span>') + '</td><td>' + theirs.map(function (x, i) { return x ? '<a class="lnk" data-player="' + x + '">' + esc(pname(x)) + '</a>' : '<span class="muted">' + esc((h.side === 'h' ? [l.nm[2], l.nm[3]] : [l.nm[0], l.nm[1]])[i] || 'N/A') + '</span>'; }).join(' / ') + '</td><td class="muted">' + (m.league ? esc(myTeam ? teamName(myTeam, m.season) : '') + ' vs ' + esc(oppTeam ? teamName(oppTeam, m.season) : 'TBD') : 'stand-alone') + '</td><td class="mono">' + esc(score) + (l.w > 2 ? ' <span class="muted">' + esc((winner[l.w] || {}).desc || '').replace(/\s*\(.*\)/, '') + '</span>' : '') + '</td></tr>';
    }).join('');
    $('#playerDetail').innerHTML = '<div class="detail"><div class="dh"><b>' + esc(p.name) + '</b><button class="back" id="playerBack">← All players</button></div>' +
      '<div class="kv"><span>Club <b>' + esc(locs[p.loc] ? locs[p.loc].name : '–') + '</b></span><span>Teams <b>' + esc(teamsStr || '–') + '</b></span><span>Season-start rating <b>' + (p.rating != null ? p.rating.toFixed(1) : '–') + '</b></span><span>Record <b>' + p.lw + '-' + p.ll + '</b> (' + pct(p.lw, p.lp) + ')</span><span>Games <b>' + p.gf + '-' + p.ga + '</b></span></div>' +
      chart + (Object.keys(partners).length ? '<div class="kv" style="margin-top:10px"><span>Partners: ' + top(partners) + '</span></div>' : '') + (Object.keys(opps).length ? '<div class="kv"><span>Opponents: ' + top(opps) + '</span></div>' : '') +
      '<h3>Match history</h3><div class="card"><div class="tablewrap"><table><tr><th>Date</th><th></th><th>Line</th><th>Partner</th><th>Opponents</th><th>Fixture</th><th>Score (own side first)</th></tr>' + (rowsHTML || '<tr><td colspan="7" class="empty">No lines played this season.</td></tr>') + '</table></div></div></div>';
    $('#playerDetail').hidden = false; $('#playerTableWrap').hidden = true;
    $('#playerBack').addEventListener('click', function () { $('#playerDetail').hidden = true; $('#playerTableWrap').hidden = false; });
    bindPlayerLinks($('#playerDetail')); bindChart($('#playerDetail'));
    window.scrollTo({ top: 0 });
  }
  function bindPlayerLinks(root) { root.querySelectorAll('[data-player]').forEach(function (a) { a.addEventListener('click', function (e) { e.stopPropagation(); showPlayer(+a.dataset.player); }); }); }

  // ---------- grouped bar chart (2 series), inline SVG with hover tooltips
  function barChart(items, nameA, nameB, caption) {
    if (!items.length) return '';
    var max = Math.max(1, Math.max.apply(null, items.map(function (i) { return Math.max(i.a, i.b); })));
    var W = 640, padL = 36, padR = 12, padT = 20, padB = 34, plotH = 150, H = padT + plotH + padB;
    var n = items.length, slot = (W - padL - padR) / n, bw = Math.max(6, Math.min(18, slot * 0.28)), gap = 2;
    var y = function (v) { return padT + plotH - (v / max) * plotH; };
    var ticks = niceTicks(max), out = '';
    ticks.forEach(function (t) { out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="currentColor" stroke-opacity=".12"/><text x="' + (padL - 6) + '" y="' + (y(t) + 4) + '" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".65">' + t + '</text>'; });
    items.forEach(function (it, i) {
      var cx = padL + slot * (i + 0.5);
      [[it.a, 'var(--series-1)', nameA, -bw - gap / 2], [it.b, 'var(--series-2)', nameB, gap / 2]].forEach(function (s) {
        var h = Math.max(0, y(0) - y(s[0])), x = cx + s[3];
        out += '<rect x="' + x + '" y="' + (y(0) - h) + '" width="' + bw + '" height="' + h + '" rx="3" fill="' + s[1] + '" data-tip="' + esc(it.label + ' · ' + s[2] + ': ' + s[0]) + '"/>';
        if (s[0]) out += '<text x="' + (x + bw / 2) + '" y="' + (y(s[0]) - 4) + '" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".8">' + s[0] + '</text>';
      });
      var lab = it.label.length > 14 ? it.label.slice(0, 13) + '…' : it.label;
      out += '<text x="' + cx + '" y="' + (H - 12) + '" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".75">' + esc(lab) + '</text>';
    });
    out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="currentColor" stroke-opacity=".35"/>';
    return '<figure><div class="legend"><span><i style="background:var(--series-1)"></i>' + esc(nameA) + '</span><span><i style="background:var(--series-2)"></i>' + esc(nameB) + '</span></div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(caption) + '">' + out + '</svg><figcaption>' + esc(caption) + '</figcaption></figure>';
  }
  function niceTicks(max) { var step = Math.pow(10, Math.floor(Math.log10(max))); if (max / step < 2) step /= 4; else if (max / step < 5) step /= 2; var t = []; for (var v = 0; v <= max; v += step) t.push(Math.round(v * 100) / 100); return t; }
  var tip = $('#tip');
  function bindChart(root) {
    root.querySelectorAll('rect[data-tip]').forEach(function (r) {
      r.addEventListener('mousemove', function (e) { tip.textContent = r.dataset.tip; tip.hidden = false; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; });
      r.addEventListener('mouseleave', function () { tip.hidden = true; });
    });
  }

  // ---------- tabs + refresh
  function showTab(t) {
    state.tab = t;
    document.querySelectorAll('nav.tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    ['overview', 'matches', 'clubs', 'players'].forEach(function (x) { document.getElementById('tab-' + x).hidden = x !== t; });
  }
  document.querySelectorAll('nav.tabs button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
  function refresh() {
    compute();
    $('#scopeSub').textContent = leagues[state.league].name + ' · ' + seasons[state.season].name + ' · data.platform.tennis';
    $('#clubDetail').hidden = true; $('#clubTableWrap').hidden = false; $('#playerDetail').hidden = true; $('#playerTableWrap').hidden = false;
    matchLimit = 60;
    renderOverview(); fillDivMatch(); renderMatches(); renderClubs(); renderPlayers();
  }
  loadLeague(state.league).then(refresh);
})();
</script>
