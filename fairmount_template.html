    html += '<div class="card" style="padding:6px 10px"><table class="tbl"><tr><th>Topic</th><th>The short version</th></tr>' + RULES.sections.map(function (s) { return '<tr class="tap" data-go="#rules/' + s.id + '"><td><b>' + esc(s.title) + '</b></td><td class="muted">' + esc(s.summary) + '</td></tr>'; }).join('') + '</table></div>';
    RULES.sections.forEach(function (s) {
      html += '<details class="sec" id="rs-' + s.id + '"' + (openId === s.id ? ' open' : '') + '><summary><span class="ic"><svg viewBox="0 0 24 24">' + (ICONS[s.icon] || ICONS.list) + '</svg></span><span><b>' + esc(s.title) + '</b><small>' + esc(s.summary) + '</small></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary><div class="body">';
      if (s.table) html += '<table class="tbl" style="margin-bottom:8px"><tr><th>League</th><th>Moves up</th><th>Moves down</th></tr>' + s.table.map(function (t) { return '<tr><td><b>' + esc(t.league) + '</b></td><td>' + esc(t.up) + '</td><td>' + esc(t.down) + '</td></tr>'; }).join('') + '</table>';
      (s.items || []).forEach(function (it) { html += '<div class="rule"><div class="rh"><b>' + esc(it.title) + '</b>' + (it.rule ? '<span class="pill">Rule ' + esc(it.rule) + '</span>' : '') + '</div><p>' + esc(it.text) + '</p>' + (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') + '</div>'; });
      if (s.note) html += '<div class="small muted" style="padding:8px 0 4px">' + esc(s.note) + '</div>';
      html += '</div></details>';
    });
    return html;
  }

  // ------------------------------------------------------------------ assistant
  var chatLog = [], sampleNS = null, sampleChecked = false;
  function mapsUrl(loc) { var q = encodeURIComponent((loc.addr ? loc.addr + ', ' : loc.name + ', ') + (loc.city ? loc.city + ', ' : '') + (loc.state || 'NJ')); return 'https://maps.apple.com/?daddr=' + q; }
  function gmapsUrl(loc) { return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent((loc.addr || loc.name) + ', ' + (loc.city || '') + ' ' + (loc.state || 'NJ')); }
  function openChat(prefill) {
    var c = $('#chat');
    c.innerHTML = '<div class="ch"><button class="back" id="chatClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div><b>PaddleAI</b><small id="chatMode">Directions, recent results, rules, players…</small></div></div>' +
      '<div class="msgs" id="msgs"></div><div class="sugg">' + ['Summary of recent matches', 'Directions to Fairmount', 'When is the next match?', 'What are the tiebreaker rules?', 'How is Fairmount 1 doing?'].map(function (s) { return '<button class="chip" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div>' +
      '<form class="cin" id="cform"><input type="text" id="cinput" placeholder="Ask anything about the club or league…" autocomplete="off"><button type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>';
    c.hidden = false;
    $('#chatClose').addEventListener('click', function () { c.hidden = true; });
    c.querySelectorAll('[data-s]').forEach(function (b) { b.addEventListener('click', function () { ask(b.dataset.s); }); });
    $('#cform').addEventListener('submit', function (e) { e.preventDefault(); var v = $('#cinput').value.trim(); if (v) { $('#cinput').value = ''; ask(v); } });
    if (!chatLog.length) addMsg('ai', 'Hi, I\u2019m PaddleAI. I can give directions to any club in the league, sum up recent Fairmount matches, look up players and teams, and answer questions about the rules.');
    else chatLog.forEach(function (m) { addMsg(m.role, m.html, true); });
    checkSample();
    if (prefill) ask(prefill);
  }
  function addMsg(role, html, replay) {
    var box = $('#msgs'); if (!box) return;
    var el = document.createElement('div'); el.className = 'msg ' + role; el.innerHTML = html; box.appendChild(el); box.scrollTop = box.scrollHeight;
    bind(el);
    if (!replay) chatLog.push({ role: role, html: html });
    return el;
  }
  function checkSample() {
    if (sampleChecked) return; sampleChecked = true;
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(function (ns) { sampleNS = ns; var m = $('#chatMode'); if (ns && m) m.textContent = 'Directions, results, rules, players — and open questions, answered by Claude'; });
    }
  }
  function findLoc(text) {
    var t = text.toLowerCase(), best = null;
    Object.values(locs).forEach(function (l) {
      var words = l.name.toLowerCase().replace(/country club|golf club|yacht club|club|\bthe\b|&|field|swim|tennis|paddle|platform|association|park|municipal|public|and/g, ' ').split(/\s+/).filter(function (w) { return w.length > 2; });
      var score = words.filter(function (w) { return t.indexOf(w) >= 0; }).length;
      if (score && (!best || score > best.score)) best = { loc: l, score: score };
    });
    return best ? best.loc : null;
  }
  function findPlayer(text) {
    var t = text.toLowerCase(), best = null;
    Object.values(players).forEach(function (p) { var n = p.name.toLowerCase(); if (n.length > 4 && t.indexOf(n) >= 0 && (!best || p.n > best.n)) best = p; });
    if (!best) { var club = clubPlayersIn(state.season); club.forEach(function (id) { var p = players[id], ln = p.name.toLowerCase().split(' ').slice(-1)[0]; if (ln.length > 3 && new RegExp('\\b' + ln.replace(/[^a-z]/g, '') + '\\b').test(t) && (!best || p.n > best.n)) best = p; }); }
    return best;
  }
  function findTeam(text) { var m = text.match(/fairmount\s*(\d)/i); if (!m) return null; var ct = clubTeamsIn(state.season); return ct.filter(function (t) { return t.name.replace(/\D/g, '') === m[1]; })[0] || null; }
  function summaryText(teamId, n) {
    var ms = clubMatchesIn(state.season).filter(function (m) { return m.played && (!teamId || m.home === teamId || m.away === teamId); }).sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); }).slice(0, n || 5);
    if (!ms.length) return 'No Fairmount matches have been played yet in ' + seasons[state.season].name + '.';
    return ms.map(function (m) { return '• ' + recap(m); }).join('\n\n');
  }
  function localAnswer(q) {
    var t = q.toLowerCase();
    if (/direction|address|where is|how do i get|map|navigate|drive to/.test(t)) {
      var loc = findLoc(t) || (/fairmount|home|our club/.test(t) ? locs[CLUB] : null);
      if (!loc) return { html: 'Which club? Try "directions to Montclair" or "where is Fairmount".' };
      return { html: '<b>' + esc(loc.name) + '</b>\n' + esc((loc.addr || '') + (loc.city ? ', ' + loc.city : '') + (loc.state ? ', ' + loc.state : '')) + '\n<a class="btn acc" href="' + mapsUrl(loc) + '" target="_blank" rel="noopener">Open in Maps</a> <a class="btn" href="' + gmapsUrl(loc) + '" target="_blank" rel="noopener">Google Maps</a>' };
    }
    if (/next match|upcoming|schedule|when (do|does|is|are)|play next|who do we play/.test(t)) {
      var up = clubMatchesIn(state.season).filter(function (m) { return !m.played && !m.bye && m.date && m.date >= today; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
      if (!up.length) { var nx = seasonList[0]; return { html: 'Nothing is on the calendar yet. The ' + esc(nx.name) + ' divisions are posted (' + clubTeamsIn(nx.id).length + ' Fairmount teams) but the schedule isn’t out. <span class="lnk2" data-go="#home">See the season preview.</span>' }; }
      return { html: up.slice(0, 5).map(function (m) { return '• ' + esc(fmtDate(m.date, true)) + ': ' + esc(tname(m.home, m.season)) + ' vs ' + esc(tname(m.away, m.season)); }).join('\n') };
    }
    if (/summar|recent|latest|last (few|week|match)|results|how did|recap|what happened/.test(t)) {
      var tm = findTeam(t);
      return { html: esc(summaryText(tm ? tm.id : null, 5)) };
    }
    if (/rule|tiebreak|tie-break|forfeit|default|lineup|line-up|stack|weather|rain|postpone|relegat|promot|move up|move down|scoring|eligib|substitut|pre-play|preplay|start time/.test(t) && RULES) {
      var hits = [], SYN = { rain: 'weather', rains: 'weather', raining: 'weather', snow: 'weather', ice: 'weather', cold: 'weather', cancel: 'postpone', cancelled: 'postpone', tie: 'tie', tied: 'tie', tiebreak: 'tiebreaker tied sets', tiebreaker: 'tiebreaker tied sets', forfeit: 'default forfeit', substitute: 'club season player', sub: 'club season player', late: 'start times', time: 'start times', report: 'posted scores', score: 'scores posted', scores: 'scores posted', stack: 'stacking lineup', stacking: 'stacking lineup', lineup: 'lineups lineup', lineups: 'lineups lineup', relegated: 'drop', promoted: 'move up' };
      var words = t.split(/\W+/).map(function (w) { return SYN[w] || w; }).join(' ').split(/\s+/).filter(function (w) { return w.length > 3; });
      RULES.sections.forEach(function (s) { (s.items || []).forEach(function (it) { var blob = (s.title + ' ' + s.summary + ' ' + it.title + ' ' + it.text + ' ' + (it.note || '')).toLowerCase(); var score = words.filter(function (w) { return blob.indexOf(w) >= 0 || blob.indexOf(w.replace(/s$/, '')) >= 0; }).length; if (score) hits.push({ s: s, it: it, score: score }); }); if (s.table && /relegat|promot|move|drop|league/.test(t)) hits.push({ s: s, it: { title: s.title, text: s.table.map(function (r) { return r.league + ': ' + r.up + '; ' + r.down; }).join('. ') }, score: 2 }); });
      hits.sort(function (a, b) { return b.score - a.score; });
      if (hits.length) return { html: hits.slice(0, 2).map(function (h) { return '<b>' + esc(h.it.title) + '</b>' + (h.it.rule ? ' (Rule ' + esc(h.it.rule) + ')' : '') + '\n' + esc(h.it.text) + (h.it.note ? '\n' + esc(h.it.note) : ''); }).join('\n\n') + '\n\n<span class="lnk2" data-go="#rules/' + hits[0].s.id + '">Open the rules page</span>' };
    }
    var tm2 = findTeam(t);
    if (tm2 && /how|doing|record|standing|going|place/.test(t)) { var r = teamRecord(tm2.id, state.season), st = standings(tm2.div, state.season), pos = st.findIndex(function (x) { return x.id === tm2.id; }); return { html: esc(tm2.name + ' is ' + r.mw + '–' + r.ml + (r.mt ? '–' + r.mt : '') + ' in ' + (divs[tm2.div] ? divs[tm2.div].name : 'its division') + (pos >= 0 ? ', ' + (pos + 1) + (['st', 'nd', 'rd'][pos] || 'th') + ' of ' + st.length : '') + ', winning ' + pct(r.lw, r.lp) + ' of lines.') + ' <span class="lnk2" data-go="#t/' + tm2.id + '">Team page</span>' }; }
    var pl = findPlayer(t);
    if (pl) { var pr = playerRecord(pl.id), ps = playerRecord(pl.id, state.season); return { html: '<b>' + esc(pl.name) + '</b> — ' + esc(ptiTxt(pl)) + '. Career ' + pr.lw + '–' + pr.ll + ' (' + pct(pr.lw, pr.lp) + ')' + (ps.lp ? ', ' + ps.lw + '–' + ps.ll + ' this season' : '') + '. <span class="lnk2" data-go="#p/' + pl.id + '">Full history</span>' }; }
    return null;
  }
  function contextForClaude() {
    var sid = state.season, ct = clubTeamsIn(sid);
    var lines = ['Club: ' + clubName() + '. League: NJ Men’s Platform Tennis Association. Season in view: ' + seasons[sid].name + '. Today: ' + today + '.'];
    ct.forEach(function (t) { var r = teamRecord(t.id, sid), st = standings(t.div, sid), pos = st.findIndex(function (x) { return x.id === t.id; }); lines.push(t.name + ' (' + (divs[t.div] ? divs[t.div].name : '') + '): ' + r.mw + '-' + r.ml + '-' + r.mt + ', place ' + (pos + 1) + '/' + st.length + ', lines ' + r.lw + '-' + (r.lp - r.lw)); });
    lines.push('Recent results:\n' + summaryText(null, 6));
    lines.push('Roster (name, PTI, W-L this season): ' + clubPlayersIn(sid).map(function (p) { var r = playerRecord(p, sid); return pname(p) + ' ' + ptiTxt(players[p]) + ' ' + r.lw + '-' + r.ll; }).join('; '));
    if (RULES) lines.push('Rules summary: ' + RULES.sections.map(function (s) { return s.title + ': ' + (s.items || []).map(function (i) { return i.title + ' - ' + i.text; }).join(' ') + (s.table ? ' ' + s.table.map(function (r) { return r.league + ': ' + r.up + '; ' + r.down; }).join(' ') : ''); }).join('\n'));
    lines.push('Clubs and addresses: ' + Object.values(locs).map(function (l) { return l.name + ' - ' + (l.addr || '') + ', ' + (l.city || ''); }).join('; '));
    return lines.join('\n');
  }
  function ask(q) {
    addMsg('me', esc(q));
    var local = localAnswer(q);
    if (local) { addMsg('ai', local.html); return; }
    if (sampleNS) {
      var el = addMsg('ai', 'Thinking…');
      sampleNS('You are the assistant inside the Fairmount Country Club paddle (platform tennis) app. Answer briefly and concretely from the data below; if it is not in the data, say so. Plain text, no markdown.\n\nDATA:\n' + contextForClaude() + '\n\nQUESTION: ' + q, { cache: false, onText: function (t) { el.textContent = t.text; } })
        .then(function (r) { el.innerHTML = esc(r.text); chatLog[chatLog.length - 1].html = el.innerHTML; })
        .catch(function (e) { el.innerHTML = esc(e && e.text ? e.text : 'Sorry, I couldn’t get an answer (' + (e && e.code || 'error') + ').'); });
      return;
    }
    addMsg('ai', 'I can answer about directions, recent matches, the schedule, rules, and any player or team by name — try one of those. Open-ended questions need the Claude-hosted version of this app.');
  }

  // ------------------------------------------------------------------ charts
  function barChart(items, nameA, nameB, caption) {
    var max = Math.max(1, Math.max.apply(null, items.map(function (i) { return Math.max(i.a, i.b); })));
    var W = 400, padL = 28, padR = 8, padT = 16, padB = 26, plotH = 110, H = padT + plotH + padB, n = items.length, slot = (W - padL - padR) / n, bw = 16, gap = 3;
    var y = function (v) { return padT + plotH - (v / max) * plotH; }, out = '';
    var step = max <= 5 ? 1 : max <= 20 ? 5 : max <= 50 ? 10 : max <= 100 ? 25 : 50;
    for (var t = 0; t <= max; t += step) out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="currentColor" stroke-opacity=".1"/><text x="' + (padL - 5) + '" y="' + (y(t) + 3.5) + '" font-size="10" text-anchor="end" fill="currentColor" fill-opacity=".55">' + t + '</text>';
    items.forEach(function (it, i) {
      var cx = padL + slot * (i + .5);
      [[it.a, 'var(--win)', nameA, -bw - gap / 2], [it.b, 'var(--loss)', nameB, gap / 2]].forEach(function (s) {
        var h = Math.max(0, y(0) - y(s[0])), x = cx + s[3];
        out += '<rect x="' + x + '" y="' + (y(0) - h) + '" width="' + bw + '" height="' + h + '" rx="3" fill="' + s[1] + '"><title>' + esc(it.label + ' · ' + s[2] + ': ' + s[0]) + '</title></rect>';
        if (s[0]) out += '<text x="' + (x + bw / 2) + '" y="' + (y(s[0]) - 3) + '" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".8">' + s[0] + '</text>';
      });
      out += '<text x="' + cx + '" y="' + (H - 9) + '" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".7">' + esc(it.label) + '</text>';
    });
    out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="currentColor" stroke-opacity=".3"/>';
    return '<figure><div class="legend"><span><i style="background:var(--win)"></i>' + esc(nameA) + '</span><span><i style="background:var(--loss)"></i>' + esc(nameB) + '</span></div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(caption) + '">' + out + '</svg><figcaption>' + esc(caption) + '</figcaption></figure>';
  }
  function sparkline(pts, caption, invert) {
    var W = 400, H = 120, padL = 34, padR = 10, padT = 14, padB = 24;
    var vs = pts.map(function (p) { return p.v; }), min = Math.min.apply(null, vs), max = Math.max.apply(null, vs); if (max - min < 4) { max += 2; min -= 2; }
    var x = function (i) { return padL + (W - padL - padR) * (pts.length === 1 ? .5 : i / (pts.length - 1)); };
    var y = function (v) { var f = (v - min) / (max - min); return padT + (H - padT - padB) * (invert ? f : 1 - f); };
    var out = '';
    [min, (min + max) / 2, max].forEach(function (t) { out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="currentColor" stroke-opacity=".1"/><text x="' + (padL - 5) + '" y="' + (y(t) + 3.5) + '" font-size="10" text-anchor="end" fill="currentColor" fill-opacity=".55">' + t.toFixed(1) + '</text>'; });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    var base = y(invert ? max : min);
    out += '<path d="' + d + ' L' + x(pts.length - 1).toFixed(1) + ' ' + base + ' L' + x(0).toFixed(1) + ' ' + base + 'Z" fill="var(--accent)" fill-opacity=".12"/><path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(function (p, i) { var last = i === pts.length - 1; out += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (last ? 5 : 3) + '" fill="' + (last ? 'var(--accent)' : 'var(--ground)') + '" stroke="var(--accent)" stroke-width="2"><title>' + esc(p.label + ': ' + p.v) + '</title></circle>'; });
    var last = pts[pts.length - 1]; out += '<text x="' + (x(pts.length - 1) - 8) + '" y="' + (y(last.v) + (invert ? 16 : -9)) + '" font-size="11" text-anchor="end" fill="currentColor" fill-opacity=".85">' + last.v.toFixed(2) + '</text>';
    var lab = [0, pts.length - 1]; if (pts.length > 4) lab.push(Math.floor((pts.length - 1) / 2));
    lab.forEach(function (i) { out += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" text-anchor="' + (i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle') + '" fill="currentColor" fill-opacity=".6">' + esc(pts[i].label) + '</text>'; });
    return '<figure><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(caption) + '">' + out + '</svg><figcaption>' + esc(caption) + '</figcaption></figure>';
  }

  // ------------------------------------------------------------------ boot
  function start(d) { ingest(d); pickDefaultSeason(); $('#brandSub').textContent = "NJ Men's Platform Tennis"; render(); }
  var inline = JSON.parse(document.getElementById('data').textContent);
  if (inline) start(inline);
  else { window.__paddle = start; var sc = document.createElement('script'); sc.src = LAZY; sc.onerror = function () { $('#view').innerHTML = '<div class="empty">Could not load the league data. Check your connection and reload.</div>'; }; document.head.appendChild(sc); }
})();
